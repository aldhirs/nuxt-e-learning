name: Build and Deploy Storefront to VPS

on:
    push:
        branches:
            - main
            - staging

    workflow_dispatch:
        inputs:
            environment:
                description: 'Deployment environment'
                required: true
                default: 'staging'
                type: choice
                options:
                    - staging
                    - production

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set environment variables
              run: |
                  if [[ "${{ github.event.inputs.environment }}" == "staging" ]] || [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
                    echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
                    echo "DOCKER_TAG=staging" >> $GITHUB_ENV
                    echo "SERVICE_NAME=nuxt-e-learning-staging" >> $GITHUB_ENV
                    echo "API_BASE_URL=https://api.staging.drillspace.id/api/v1" >> $GITHUB_ENV
                  else
                    echo "DEPLOY_ENV=production" >> $GITHUB_ENV
                    echo "DOCKER_TAG=production" >> $GITHUB_ENV
                    echo "SERVICE_NAME=nuxt-e-learning-production" >> $GITHUB_ENV
                    echo "API_BASE_URL=https://api.drillspace.id/api/v1" >> $GITHUB_ENV
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  tags: |
                      tecnoduct/nuxt-e-learning:${{ env.DOCKER_TAG }}
                      tecnoduct/nuxt-e-learning:${{ env.DOCKER_TAG }}-${{ github.sha }}
                  build-args: |
                      NUXT_PUBLIC_API_BASE_URL=${{ env.API_BASE_URL }}
                      NUXT_PUBLIC_ANALYTICS_ENABLED=${{ env.DEPLOY_ENV == 'production' }}
                      NUXT_PUBLIC_ENABLE_PROFILE_EDIT=true
                      BUILD_VERSION=${{ github.sha }}
                      BUILD_TIME=${{ github.event.head_commit.timestamp }}
                  cache-from: type=registry,ref=tecnoduct/nuxt-e-learning:${{ env.DOCKER_TAG }}
                  cache-to: type=inline
                  labels: |
                      environment=${{ env.DEPLOY_ENV }}
                      version=${{ github.sha }}
                      commit=${{ github.sha }}
                      branch=${{ github.ref_name }}
                      build-time=${{ github.event.head_commit.timestamp }}

            - name: Run security scan
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: tecnoduct/nuxt-e-learning:${{ env.DOCKER_TAG }}
                  format: 'table'
                  severity: 'CRITICAL,HIGH'

            - name: Deploy to VPS via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: 22
                  script: |
                      cd e-learning/${{ env.DEPLOY_ENV }}
                      docker compose pull ${{ env.SERVICE_NAME }}
                      docker compose up -d ${{ env.SERVICE_NAME }}
                      echo "Waiting for service to be ready..."
                      sleep 15

            - name: Health check
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: 22
                  script: |
                      cd e-learning/${{ env.DEPLOY_ENV }}
                      for i in {1..5}; do
                        echo "Health check attempt $i/5..."
                        RESPONSE=$(docker compose exec -T ${{ env.SERVICE_NAME }} curl -sf http://127.0.0.1:3000/ 2>&1 | head -c 200)
                        EXIT_CODE=$?

                        if [ $EXIT_CODE -eq 0 ]; then
                          echo "✅ Health check passed!"
                          exit 0
                        fi

                        echo "❌ Attempt $i failed (exit=$EXIT_CODE)"
                        if [ $i -lt 5 ]; then
                          echo "Retrying in 10s..."
                          sleep 10
                        fi
                      done

                      echo "❌ Health check failed after 5 attempts"
                      docker compose logs --tail=100 ${{ env.SERVICE_NAME }}
                      exit 1

            - name: Notify deployment success
              if: success()
              uses: appleboy/telegram-action@master
              with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  format: markdown
                  message: |
                      ✅ *Nuxt Storefront Deployment Successful!*
                      ${{ env.DEPLOY_ENV == 'production' && '🟢' || '🟡' }} *Environment: ${{ env.DEPLOY_ENV }}*

                      📦 Repository: `${{ github.repository }}`
                      🔖 Commit: `${{ github.sha }}`
                      🌿 Branch: `${{ github.ref }}`
                      👤 Author: ${{ github.actor }}
                      🕐 Time: ${{ github.event.head_commit.timestamp }}
                      🐳 Docker Tag: `${{ env.DOCKER_TAG }}`

                      [View Commit](${{ github.event.head_commit.url }})

            - name: Notify deployment failure
              if: failure()
              uses: appleboy/telegram-action@master
              with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  format: markdown
                  message: |
                      ❌ *Nuxt Storefront Deployment Failed!*
                      ${{ env.DEPLOY_ENV == 'production' && '🟢' || '🟡' }} *Environment: ${{ env.DEPLOY_ENV || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}*

                      📦 Repository: `${{ github.repository }}`
                      🔖 Commit: `${{ github.sha }}`
                      🌿 Branch: `${{ github.ref }}`
                      👤 Author: ${{ github.actor }}
                      🕐 Time: ${{ github.event.head_commit.timestamp }}
                      🐳 Docker Tag: `${{ env.DOCKER_TAG }}`

                      ⚠️ Please check the logs immediately!
                      [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
